<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감독일지 사진 자동 첨부</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--blue:#1f6feb;--navy:#1f3a5f;--line:#d8dde6;--bg:#f4f5f7;--red:#d93f3f}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;margin:0;background:var(--bg);color:#222}
header{background:var(--navy);color:#fff;padding:14px 24px;font-size:18px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:normal;font-size:12px;opacity:.8}
main{max-width:1200px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;padding:18px 22px;margin-bottom:16px;box-shadow:0 1px 3px #0002}
h2{font-size:16px;margin:0 0 12px}
button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.55;cursor:default}
button.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;margin:6px 0 14px;background:#fafbfc}
.drop.over{border-color:var(--blue);background:#eef4ff}
.drop b{display:block;margin-bottom:6px}
.muted{color:#777;font-size:12px}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.prog{display:none;flex:1;min-width:320px;max-width:560px}
.bar{height:22px;background:#e6e9ef;border-radius:11px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f6feb,#3fb4ff);transition:width .25s}
.bar b{position:absolute;inset:0;text-align:center;font-size:12px;line-height:22px;color:#123}
.pinfo{font-size:12px;color:#444;margin-top:4px;min-height:32px}
.err{color:var(--red)}
.sec{border:2px dashed #ccd;border-radius:8px;padding:10px;margin-bottom:12px;min-height:64px;background:#fff}
.sec.over{background:#eaf2ff;border-color:var(--blue)}
.sec h3{margin:0 0 8px;font-size:14px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:140px;background:#fafafa;border:1px solid #ddd;border-radius:6px;padding:4px;font-size:11px;cursor:grab}
.ph img{width:100%;height:105px;object-fit:cover;border-radius:4px;display:block}
.ph.check{border:2px solid var(--red)}
.ph select{width:100%;font-size:11px;margin-top:3px}
.ph .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;background:var(--red);color:#fff;font-size:10px}
.sticky{position:sticky;top:0;z-index:5}
#done ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.hidden{display:none}
.pick{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.pick .lbl{width:64px;font-size:13px;color:#555}
button.sm{padding:6px 14px;font-size:13px}
button.x{background:#fff;color:var(--red);border:1px solid var(--red);padding:5px 12px;font-size:12px}
.fname{font-size:13px;color:#333}
.fname.none{color:#999}
.pv{border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 14px;background:#fff}
.pv h4{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;max-height:430px;overflow:auto}
.pvc{position:relative;border:1px solid #e1e4ea;border-radius:6px;padding:4px;background:#fafbfc;font-size:11px}
.pvc img{width:100%;height:80px;object-fit:cover;border-radius:4px;display:block}
.pvc .no{position:absolute;top:6px;left:6px;background:#1f3a5fd9;color:#fff;border-radius:9px;padding:0 6px;font-weight:bold}
.pvc .rm{position:absolute;top:5px;right:5px;width:20px;height:20px;line-height:18px;padding:0;border-radius:50%;background:#fff;color:var(--red);border:1px solid var(--red);font-size:13px}
.pvc .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pvc .src{color:#888}
.sec.excl{border:2px solid var(--red);background:repeating-linear-gradient(45deg,#fff6f6,#fff6f6 12px,#ffeded 12px,#ffeded 24px)}
.sec.excl h3{color:var(--red);font-size:15px}
.sec.excl .exnote{display:block;font-weight:normal;font-size:12px;color:#a33;margin-top:3px}
.sec.excl .ph{background:#fff;border-color:#e3b4b4}
.sec.excl .ph img{filter:grayscale(1);opacity:.6}
.sec.excl .ph .nm{text-decoration:line-through;color:#a66}
.sec.excl.over{background:#ffe3e3}
label{cursor:pointer}
</style>
</head>
<body>
<header>현장 감독 일지 · 사진 자동 첨부 <small>사진은 이 PC 밖으로 전송되지 않습니다</small></header>
<main>

<section id="step1" class="card">
  <h2>① 파일 올리기</h2>
  <div class="drop" id="dropDocx"><b>사진 넣기 전 워드(.docx)</b>
    <div class="pick"><button class="ghost sm" id="docxBtn">파일 선택</button><span class="fname none" id="docxName">선택된 파일 없음</span><button class="x" id="docxClear" hidden>취소</button></div>
    <input type="file" id="docx" accept=".docx" hidden>
    <div class="muted">또는 워드 파일을 이 칸에 끌어다 놓기</div></div>
  <div class="drop" id="dropPh"><b>현장 사진</b>
    <div class="pick"><span class="lbl">사진 파일</span><button class="ghost sm" id="phBtn">파일 선택</button><span class="fname none" id="phName">선택된 파일 없음</span><button class="x" id="phClear" hidden>취소</button></div>
    <div class="pick"><span class="lbl">사진 폴더</span><button class="ghost sm" id="fdBtn">폴더 선택</button><span class="fname none" id="fdName">선택된 폴더 없음</span><button class="x" id="fdClear" hidden>취소</button></div>
    <input type="file" id="photos" accept="image/*" multiple hidden><input type="file" id="folder" webkitdirectory hidden>
    <div class="muted">또는 사진이나 폴더를 이 칸에 끌어다 놓기 (사진 파일 쪽에 추가됩니다)</div></div>
  <div class="pv hidden" id="pv"><h4><span>넣은 사진 확인 <span class="muted" id="pvInfo"></span></span><button class="x" id="pvClear">사진 모두 비우기</button></h4><div class="pvgrid" id="pvGrid"></div></div>
  <div class="row">
    <button id="start">자동 분류 시작</button>
    <div class="prog" id="prog"><div class="bar"><i id="pbar"></i><b id="ppct">0%</b></div><div class="pinfo" id="pinfo"></div></div>
  </div>
  <p class="muted" id="libinfo">기준 사진 불러오는 중…</p>
</section>

<section id="step2" class="hidden">
  <div class="card sticky row">
    <div>사진 <b id="nAll">0</b>장 · <span class="tag">확인</span> <b id="nChk">0</b>장 — 틀린 사진은 끌어서 옮기거나 선택 상자로 바꾸세요</div>
    <label><input type="checkbox" id="optDiag" checked> 지난 회차 계통도 넣기</label>
    <button id="build">③ 워드 만들기</button>
    <button class="ghost" id="restart">처음으로</button>
    <span class="pinfo" id="binfo"></span>
  </div>
  <div id="secs"></div>
</section>

<section id="done" class="card hidden">
  <h2>④ 완성</h2>
  <div id="doneMsg"></div>
  <div class="row" style="margin-top:12px"><button id="dl">워드 다시 내려받기</button><button class="ghost" id="restart2">새 작업</button></div>
</section>

</main>
<script type="module">
import { loadModel, decode, embed, classify, prepJpeg, assemble, b64ToF32 } from './engine.js';

const $ = id => document.getElementById(id);
let LIB = null, REFS = [], items = [], docxFile = null, photoFiles = [], lastBlob = null, lastName = '';

// ---------------------------------------------------------- 라이브러리
(async () => {
  try {
    const [base, refs] = await Promise.all([fetch('./lib_base.json').then(r => r.json()), fetch('./lib_refs.json').then(r => r.json())]);
    LIB = base;
    REFS = refs.refs.map(r => ({ k: r.k, emb: b64ToF32(r.emb) }));
    $('libinfo').textContent = `분류 기준: ${LIB.version} 회차 완성본 사진 ${REFS.length}장 · 섹션 ${Object.keys(LIB.sections).length}개`;
  } catch (e) { $('libinfo').innerHTML = '<span class="err">기준 데이터를 불러오지 못했습니다: ' + e.message + '</span>'; }
})();

// ---------------------------------------------------------- 파일 선택 / 끌어다 놓기
const IMG = /\.(jpe?g|png|webp|bmp)$/i;
let fromFiles = [], fromFolder = [], folderName = '';
const keyOf = f => f.name + '|' + f.size + '|' + f.lastModified;
const thumbs = new Map(); // key -> objectURL (미리보기와 분류 화면에서 같이 씀)
const urlOf = f => { const k = keyOf(f); if (!thumbs.has(k)) thumbs.set(k, URL.createObjectURL(f)); return thumbs.get(k); };

function setName(id, text, has) { const el = $(id); el.textContent = text; el.classList.toggle('none', !has); }
function setDocx(f) {
  docxFile = f || null;
  setName('docxName', f ? f.name : '선택된 파일 없음', !!f);
  $('docxClear').hidden = !f;
}
function refreshPhotos() {
  const seen = new Set(); const all = [];
  for (const [f, src] of [...fromFiles.map(f => [f, '파일']), ...fromFolder.map(f => [f, '폴더'])]) {
    const k = keyOf(f); if (seen.has(k)) continue; seen.add(k); f._src = src; all.push(f);
  }
  photoFiles = all.sort((a, b) => a.name.localeCompare(b.name, 'ko', { numeric: true }));
  setName('phName', fromFiles.length ? `${fromFiles.length}장 선택됨` : '선택된 파일 없음', fromFiles.length > 0);
  setName('fdName', fromFolder.length ? `${folderName || '폴더'} — 사진 ${fromFolder.length}장` : '선택된 폴더 없음', fromFolder.length > 0);
  $('phClear').hidden = !fromFiles.length; $('fdClear').hidden = !fromFolder.length;
  // 미리보기: 1. 2. 3. ... (파일명 순서 = 워드 안 배치 순서)
  $('pv').classList.toggle('hidden', !photoFiles.length);
  $('pvInfo').textContent = `${photoFiles.length}장 · 번호 순서(파일명 순) = 워드 안 배치 순서`;
  const g = $('pvGrid'); g.innerHTML = '';
  photoFiles.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'pvc'; d.title = f.name;
    d.innerHTML = `<img src="${urlOf(f)}" loading="lazy" alt=""><span class="no">${i + 1}</span><button class="rm" title="이 사진 빼기">×</button><div class="nm">${i + 1}. ${f.name}</div><div class="src">${f._src}</div>`;
    d.querySelector('.rm').onclick = () => { const k = keyOf(f); fromFiles = fromFiles.filter(x => keyOf(x) !== k); fromFolder = fromFolder.filter(x => keyOf(x) !== k); refreshPhotos(); };
    g.appendChild(d);
  });
}
const onlyImg = list => Array.from(list).filter(f => IMG.test(f.name));
$('docxBtn').onclick = () => $('docx').click();
$('phBtn').onclick = () => $('photos').click();
$('fdBtn').onclick = () => $('folder').click();
$('docx').onchange = e => { if (e.target.files[0]) setDocx(e.target.files[0]); e.target.value = ''; };
$('photos').onchange = e => { if (e.target.files.length) { fromFiles = onlyImg(e.target.files); refreshPhotos(); } e.target.value = ''; };
$('folder').onchange = e => {
  if (e.target.files.length) { fromFolder = onlyImg(e.target.files); const rp = e.target.files[0].webkitRelativePath || ''; folderName = rp.split('/')[0]; refreshPhotos(); }
  e.target.value = '';
};
$('docxClear').onclick = () => setDocx(null);
$('phClear').onclick = () => { fromFiles = []; refreshPhotos(); };
$('fdClear').onclick = () => { fromFolder = []; folderName = ''; refreshPhotos(); };
$('pvClear').onclick = () => { fromFiles = []; fromFolder = []; folderName = ''; refreshPhotos(); };

async function readEntries(entry, out) {
  if (entry.isFile) { out.push(await new Promise(r => entry.file(r))); return; }
  if (entry.isDirectory) {
    const rd = entry.createReader();
    for (;;) { const batch = await new Promise(r => rd.readEntries(r)); if (!batch.length) break; for (const e of batch) await readEntries(e, out); }
  }
}
function dropZone(el, onFiles) {
  el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = async e => {
    e.preventDefault(); el.classList.remove('over');
    const out = [];
    const its = Array.from(e.dataTransfer.items || []);
    if (its.length && its[0].webkitGetAsEntry) { const ens = its.map(it => it.webkitGetAsEntry()).filter(Boolean); for (const en of ens) await readEntries(en, out); }
    else out.push(...e.dataTransfer.files);
    onFiles(out);
  };
}
dropZone($('dropDocx'), fs => { const f = fs.find(f => /\.docx$/i.test(f.name)); if (f) setDocx(f); });
dropZone($('dropPh'), fs => { const add = onlyImg(fs); if (add.length) { fromFiles = [...fromFiles, ...add]; refreshPhotos(); } });

// ---------------------------------------------------------- 진행률
function show(p, t) { p = Math.max(0, Math.min(100, p)); $('pbar').style.width = p + '%'; $('ppct').textContent = Math.floor(p) + '%'; $('pinfo').innerHTML = t; }
const fmt = s => { s = Math.max(0, Math.round(s)); return s >= 60 ? Math.floor(s / 60) + '분 ' + (s % 60) + '초' : s + '초'; };
const fail = msg => { show(0, '<span class="err">' + msg + '</span>'); $('start').disabled = false; $('start').textContent = '자동 분류 시작'; };

// ---------------------------------------------------------- ② 분류
$('start').onclick = async () => {
  if (!docxFile) return fail('사진 넣기 전 워드(.docx)를 선택하세요.');
  if (!photoFiles.length) return fail('현장 사진을 선택하세요.');
  if (!LIB) return fail('기준 데이터가 아직 준비되지 않았습니다. 잠시 후 다시 누르세요.');
  $('start').disabled = true; $('start').textContent = '진행 중…'; $('prog').style.display = 'block';
  try {
    // 0~20%: 분류 엔진 준비 (처음 한 번 약 30MB, 이후 브라우저 캐시)
    const t0 = performance.now();
    await loadModel((g, t) => {
      const sec = (performance.now() - t0) / 1000;
      show(20 * g / t, `분류 엔진 내려받는 중 ${(g / 1048576).toFixed(1)} / ${(t / 1048576).toFixed(1)} MB · ${(g / 1048576 / Math.max(sec, .1)).toFixed(1)} MB/초 (처음 한 번만)`);
    });
    show(20, '분류 엔진 준비 완료');
    // 20~100%: 사진별 분류
    items = []; const t1 = performance.now();
    for (let i = 0; i < photoFiles.length; i++) {
      const f = photoFiles[i];
      const bmp = await decode(f);
      const r = classify(await embed(bmp), REFS);
      items.push({ file: f, name: f.name, url: urlOf(f), ...r, origSection: r.section, origStatus: r.status });
      bmp.close && bmp.close();
      const done = i + 1, rate = done / ((performance.now() - t1) / 1000);
      show(20 + 80 * done / photoFiles.length,
        `분류 중 ${done} / ${photoFiles.length}장 · ${rate.toFixed(2)}장/초 · 남은 시간 약 ${fmt((photoFiles.length - done) / rate)}<br><span class="muted">${f.name}</span>`);
      await new Promise(r => setTimeout(r, 0));
    }
    show(100, '완료! 결과 화면으로 이동합니다…');
    setTimeout(renderReview, 300);
  } catch (e) { console.error(e); fail('오류: ' + (e.message || e)); }
};

// ---------------------------------------------------------- 검토 화면
function card(it) {
  const d = document.createElement('div');
  d.className = 'ph' + (it.status === 'check' ? ' check' : ''); d.draggable = true; d.dataset.name = it.name;
  d.title = `${it.name}\n유사도 ${it.sim} / 2순위 1-${it.second}`;
  const opts = Object.entries(LIB.sections).map(([k, v]) => `<option value="${k}">1-${k} ${v.title.slice(0, 10)}</option>`).join('') + '<option value="0">제외</option>';
  d.innerHTML = `<img src="${it.url}" loading="lazy" alt=""><div class="nm"></div><select>${opts}</select>`;
  paintCard(d, it);
  const sel = d.querySelector('select'); sel.value = String(it.section);
  sel.onchange = () => move(d, +sel.value);
  d.ondragstart = e => { e.dataTransfer.setData('text/plain', it.name); };
  return d;
}
// 확인 표시: 처음 자동 분류된 자리(확인 필요였던 곳)로 돌아오면 다시 빨간 표시
function paintCard(d, it) {
  d.classList.toggle('check', it.status === 'check');
  d.querySelector('.nm').innerHTML = `${it.name} ${it.status === 'check' ? '<span class="tag">확인</span>' : ''}`;
  d.title = `${it.name}\n유사도 ${it.sim} / 2순위 1-${it.second}` + (it.origStatus === 'check' ? `\n처음 분류: 1-${it.origSection} (확인 필요)` : '');
}
function move(d, k) {
  const it = items.find(x => x.name === d.dataset.name); it.section = k;
  it.status = (it.origStatus === 'check' && k === it.origSection) ? 'check' : 'ok';
  paintCard(d, it);
  d.querySelector('select').value = String(k);
  // 섹션 안에서는 파일명 순서 유지
  const grid = document.querySelector(`.sec[data-k="${k}"] .grid`);
  const after = Array.from(grid.children).find(c => c.dataset.name.localeCompare(d.dataset.name, 'ko', { numeric: true }) > 0);
  grid.insertBefore(d, after || null); counts();
}
function counts() {
  document.querySelectorAll('.sec').forEach(s => s.querySelector('.cnt').textContent = s.querySelectorAll('.ph').length);
  $('nAll').textContent = items.length; $('nChk').textContent = items.filter(i => i.status === 'check').length;
}
function renderReview() {
  $('step1').classList.add('hidden'); $('step2').classList.remove('hidden');
  const box = $('secs'); box.innerHTML = '';
  const secs = [...Object.entries(LIB.sections).map(([k, v]) => [k, `1-${k}. ${v.title}`]), ['0', '🚫 제외 — 워드에 넣지 않을 사진']];
  for (const [k, title] of secs) {
    const s = document.createElement('div'); s.className = 'sec' + (k === '0' ? ' excl' : ''); s.dataset.k = k;
    s.innerHTML = `<h3>${title} <span class="muted">(<span class="cnt">0</span>장)</span>${k === '0' ? '<span class="exnote">여기로 옮긴 사진은 완성 워드에 들어가지 않습니다. 잘못 옮겼다면 다시 원래 칸으로 끌어다 놓으세요.</span>' : ''}</h3><div class="grid"></div>`;
    s.ondragover = e => { e.preventDefault(); s.classList.add('over'); };
    s.ondragleave = () => s.classList.remove('over');
    s.ondrop = e => { e.preventDefault(); s.classList.remove('over'); const n = e.dataTransfer.getData('text/plain'); const d = document.querySelector(`.ph[data-name="${CSS.escape(n)}"]`); if (d) move(d, +k); };
    box.appendChild(s);
    for (const it of items.filter(i => String(i.section) === k)) s.querySelector('.grid').appendChild(card(it));
  }
  counts(); window.scrollTo(0, 0);
}

// ---------------------------------------------------------- ③ 워드 만들기 / 내려받기
let downloads = null;
(async () => { try { if (window.claude && claude.use) downloads = await claude.use('downloads'); } catch (e) { downloads = null; } })();

async function offer(blob, name) {
  if (!downloads) { try { if (window.claude && claude.use) downloads = await claude.use('downloads'); } catch (e) { downloads = null; } }
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); return '내려받기를 승인하면 저장됩니다.'; }
    catch (e) {
      if (e && e.code === 'declined') return '내려받기를 취소했습니다. 아래 버튼으로 다시 받을 수 있습니다.';
      if (e && e.code === 'rate_limited') return '이미 저장 확인 창이 열려 있습니다. 잠시 후 다시 누르세요.';
    }
  }
  // 다른 곳(사내 서버, Vercel 등)에 올렸을 때를 위한 일반 다운로드
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  return '다운로드 폴더를 확인하세요.';
}

$('build').onclick = async () => {
  $('build').disabled = true; $('binfo').textContent = '워드 만드는 중…';
  try {
    const assign = {};
    const sorted = [...items].sort((a, b) => a.name.localeCompare(b.name));
    const use = sorted.filter(i => i.section > 0);
    for (let i = 0; i < use.length; i++) {
      const it = use[i];
      $('binfo').textContent = `사진 정리 중 ${i + 1} / ${use.length}`;
      const bmp = await decode(it.file);
      (assign[it.section] = assign[it.section] || []).push(await prepJpeg(bmp));
      bmp.close && bmp.close();
    }
    $('binfo').textContent = '워드에 넣는 중…';
    const { blob, report } = await assemble(docxFile, LIB, assign, { diagrams: $('optDiag').checked });
    lastBlob = blob; lastName = docxFile.name.replace(/\.docx$/i, '') + '_사진첨부.docx';
    const msg = await offer(blob, lastName);
    $('step2').classList.add('hidden'); $('done').classList.remove('hidden');
    $('doneMsg').innerHTML = `<b>${lastName}</b> (${(blob.size / 1048576).toFixed(1)} MB) — ${msg}<ul>${report.map(r => `<li>1-${r.k}. ${r.title}: ${r.msg}</li>`).join('')}</ul>`;
  } catch (e) { console.error(e); $('binfo').innerHTML = '<span class="err">오류: ' + (e.message || e) + '</span>'; }
  $('build').disabled = false;
};
$('dl').onclick = async () => { if (lastBlob) $('doneMsg').querySelector('b').insertAdjacentText('afterend', ''), await offer(lastBlob, lastName); };
const restart = () => { items = []; $('done').classList.add('hidden'); $('step2').classList.add('hidden'); $('step1').classList.remove('hidden'); $('start').disabled = false; $('start').textContent = '자동 분류 시작'; $('prog').style.display = 'none'; };
$('restart').onclick = restart; $('restart2').onclick = restart;
window.__app = { get items() { return items; }, render: () => renderReview() };
</script>
</body>
</html>
